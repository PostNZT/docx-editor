name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish changed packages and tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          semver_bin="$GITHUB_WORKSPACE/node_modules/.bin/semver"
          for pkg_dir in packages/react packages/agent-use; do
            pushd "$pkg_dir" > /dev/null
            name=$(node -p "require('./package.json').name")
            local_ver=$(node -p "require('./package.json').version")
            if ! "$semver_bin" "$local_ver" > /dev/null 2>&1; then
              echo "::error::$name has invalid semver in package.json: $local_ver"
              exit 1
            fi
            remote_ver=$(npm view "$name" version 2>/dev/null || echo "")
            if [ -z "$remote_ver" ] || "$semver_bin" "$local_ver" -r ">$remote_ver" > /dev/null; then
              echo "Publishing $name@$local_ver (npm has ${remote_ver:-<unpublished>})"
              npm publish --provenance --access public
              tag="$name@$local_ver"
              popd > /dev/null
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
            else
              echo "Skip $name: local=$local_ver, npm=$remote_ver (not greater)"
              popd > /dev/null
            fi
          done
