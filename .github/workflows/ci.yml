name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      issues: write # semantic-release comments on resolved issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # npm provenance (OIDC)
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false # semantic-release uses GITHUB_TOKEN for git

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # TEMPORARY diagnostic — prints only the token LENGTH and the npm whoami
      # result (never the value; GitHub masks the secret regardless). Remove once
      # the release publishes successfully.
      - name: 'DEBUG: verify npm auth'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "== NPM_TOKEN diagnostics =="
          echo "raw length:               ${#NPM_TOKEN}"
          trimmed="$(printf '%s' "$NPM_TOKEN" | tr -d '[:space:]')"
          echo "length without whitespace: ${#trimmed}"
          case "$NPM_TOKEN" in
            "") echo "RESULT: EMPTY — secret is not reaching this job (wrong name/location?)" ;;
            npm_*) echo "prefix: OK (starts with npm_)" ;;
            *) echo "prefix: WRONG — value does not start with npm_" ;;
          esac
          echo "== npm whoami (the exact check semantic-release runs) =="
          npm --version
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          if npm whoami --registry=https://registry.npmjs.org/; then
            echo "RESULT: whoami OK — token authenticates; semantic-release should now publish"
          else
            echo "RESULT: whoami FAILED — npm rejects this token (IP allowlist / expired / revoked / empty)"
          fi
          rm -f "$HOME/.npmrc"

      # semantic-release derives the version from Conventional Commits, publishes
      # @postnzt/docx-editor (packages/react) to npm with provenance, then tags and
      # creates the GitHub Release. Config lives in .releaserc.json. The vX.Y.Z git
      # tags are the source of truth for the last released version, so nothing is
      # committed back to the repo.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
