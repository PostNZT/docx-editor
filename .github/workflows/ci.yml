name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      issues: write # semantic-release comments on resolved issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # OIDC for npm trusted publishing (+ automatic provenance)
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false # semantic-release uses GITHUB_TOKEN for git

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 ships npm >= 11.5.1, required for trusted publishing (OIDC).
      # No registry-url: it would write an empty _authToken line that shadows OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # semantic-release derives the version from Conventional Commits, publishes
      # @postnzt/docx-editor (packages/react) to npm, then tags and creates the
      # GitHub Release. Config lives in .releaserc.json. The vX.Y.Z git tags are the
      # source of truth for the last released version, so nothing is committed back.
      #
      # Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN, and provenance
      # is generated automatically. Requires id-token: write (above) and the
      # package's Trusted Publisher configured on npmjs.com for repo PostNZT/docx-editor
      # + workflow ci.yml.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
