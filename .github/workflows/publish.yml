name: Publish to npm (manual)

# Automatic publishing happens in ci.yml on push to main (it derives the
# semantic version from Conventional Commits, publishes, tags, and creates the
# GitHub Release). This workflow is a MANUAL fallback only — e.g. to re-publish
# or to dry-run. The `release: published` trigger was removed so it does not
# double-publish (and fail) on releases created by ci.yml.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Perform a dry run (no actual publish)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry-run == 'true' }}
        working-directory: packages/react
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ github.event.inputs.dry-run != 'true' }}
        working-directory: packages/react
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
